<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>

    <div class="test-section">
        <h3>Test 1: Pollinations AI (Should always work)</h3>
        <button onclick="testPollinations()">Test Pollinations</button>
        <div id="pollinations-result"></div>
    </div>

    <div class="test-section">
        <h3>Test 2: Hugging Face API (Free tier)</h3>
        <button onclick="testHuggingFace()">Test Hugging Face</button>
        <div id="huggingface-result"></div>
    </div>

    <div class="test-section">
        <h3>Test 3: Network Connection</h3>
        <button onclick="testNetwork()">Test Network</button>
        <div id="network-result"></div>
    </div>

    <script>
        async function testPollinations() {
            const resultDiv = document.getElementById('pollinations-result');
            resultDiv.innerHTML = '<p>Testing Pollinations...</p>';

            try {
                const prompt = 'a beautiful sunset';
                const encodedPrompt = encodeURIComponent(prompt);
                const timestamp = Date.now();
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${timestamp}&nologo=true`;

                // Test if image loads
                const img = new Image();
                img.onload = () => {
                    resultDiv.innerHTML = `
                        <p class="success">✅ Pollinations AI: SUCCESS</p>
                        <p>URL: ${imageUrl}</p>
                        <img src="${imageUrl}" style="max-width: 256px;">
                    `;
                };
                img.onerror = (error) => {
                    resultDiv.innerHTML = `<p class="error">❌ Pollinations AI: FAILED to load image</p>`;
                };
                img.src = imageUrl;

            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Pollinations AI: ERROR - ${error.message}</p>`;
            }
        }

        async function testHuggingFace() {
            const resultDiv = document.getElementById('huggingface-result');
            resultDiv.innerHTML = '<p>Testing Hugging Face API...</p>';

            try {
                const API_URL = 'https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: 'a beautiful sunset',
                        parameters: {
                            num_inference_steps: 50,
                            guidance_scale: 7.5
                        }
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <p class="error">❌ Hugging Face API: HTTP ${response.status}</p>
                        <pre>${errorText}</pre>
                    `;
                    return;
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);

                resultDiv.innerHTML = `
                    <p class="success">✅ Hugging Face API: SUCCESS</p>
                    <img src="${imageUrl}" style="max-width: 256px;">
                `;

            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Hugging Face API: ERROR</p>
                    <pre>Error: ${error.message}
Stack: ${error.stack}</pre>
                `;
            }
        }

        async function testNetwork() {
            const resultDiv = document.getElementById('network-result');
            resultDiv.innerHTML = '<p>Testing network connection...</p>';

            const tests = [
                { name: 'Google', url: 'https://www.google.com' },
                { name: 'Hugging Face', url: 'https://huggingface.co' },
                { name: 'Pollinations', url: 'https://image.pollinations.ai' }
            ];

            let html = '<ul>';

            for (const test of tests) {
                try {
                    const response = await fetch(test.url, { method: 'HEAD', mode: 'no-cors' });
                    html += `<li class="success">✅ ${test.name}: Reachable</li>`;
                } catch (error) {
                    html += `<li class="error">❌ ${test.name}: ${error.message}</li>`;
                }
            }

            html += '</ul>';
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
